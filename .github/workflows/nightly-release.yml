name: nightly-release

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One publisher at a time, from source selection through signed asset read-back.
concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'Gvetri/hermes-native-client' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      validation_run_id: ${{ steps.prepare.outputs.validation_run_id }}
      validation_run_attempt: ${{ steps.prepare.outputs.validation_run_attempt }}
      version_code: ${{ steps.prepare.outputs.version_code }}
      generation_attempt: ${{ steps.prepare.outputs.generation_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select validated main source and skip an existing Nightly
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly-release.py prepare

  sign:
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    uses: ./.github/workflows/release-signing.yml
    with:
      validation_run_id: ${{ needs.prepare.outputs.validation_run_id }}
      nightly_version_code: ${{ needs.prepare.outputs.version_code }}
      generation_attempt: ${{ needs.prepare.outputs.generation_attempt }}

  publish:
    needs: [prepare, sign]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.validation_run_id }}
      RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.prepare.outputs.validation_run_attempt }}
      RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      RELEASE_GENERATION_ATTEMPT: ${{ needs.prepare.outputs.generation_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_artifact_id }}
          path: signed
          merge-multiple: true
      - name: Verify, stage, read back, and publish the Nightly prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly-release.py publish signed .github/release-certificate.sha256
