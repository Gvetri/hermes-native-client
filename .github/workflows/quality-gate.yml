name: quality-gate

on:
  # A draft transition re-evaluates the head, so a draft run can never stand in for the complete
  # gate of a ready pull request, and a title edit re-verifies the squash-merge title.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One concurrency group per pull request, so the runs of a pull request never race: a newer run
# replaces an obsolete one, and the required status always belongs to the current head's own run.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # External forks are untrusted: this run is read-only, secret-free, and carries no repository
  # state, and it stops here. A maintainer validates an external change by carrying it onto an
  # in-repository branch, where the complete gate runs against a commit-verified head.
  fork_guard:
    name: fork-guard
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report external-fork handling
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            printf '%s\n' 'External-fork pull request: this run is read-only and secret-free, and it does not hold a passing required status. A maintainer must carry the change onto an in-repository branch, where the complete gate validates it.'
          else
            printf '%s\n' 'In-repository pull request: the complete quality gate is required for this head.'
          fi

  # A draft pull request runs this lightweight, secret-free validation instead of the complete
  # deterministic gate, which the aggregate gate requires once the pull request is ready.
  draft_validation:
    name: draft-validation
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate the draft pull request
        run: ./gradlew formatCheck :app:lintDebug --no-daemon

  # Every pull-request-scoped check below runs for a ready in-repository pull request, for a push to
  # main, and for the nightly and manual runs. A draft pull request runs the lightweight validation
  # only, and an external fork runs the read-only guard only.
  formatting:
    name: formatting
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew formatCheck --no-daemon

  static_analysis:
    name: static-analysis
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDebug --no-daemon

  unit_tests:
    name: unit-tests
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRequiredUnitTests --no-daemon
      - name: Redact JVM test reports
        id: redact_jvm_reports
        if: ${{ failure() }}
        timeout-minutes: 1
        run: python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" 'feature/entry/*/build/test-results/**/*.xml'
      - name: Upload JVM test reports
        if: ${{ failure() && steps.redact_jvm_reports.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: feature/entry/*/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  fixture_descriptor:
    name: fixture-descriptor
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureDescriptorTests verifyFixtureDescriptor --no-daemon

  fixture_lifecycle:
    name: fixture-lifecycle
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureLifecycleTests journeyScenarioTests --no-daemon

  fixture_contract:
    name: fixture-contract
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureContractTests --no-daemon

  android_build:
    name: android-build
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

  architecture_check:
    name: architecture-check
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew architectureCheck architectureRuleTests verifyNoMocks verifyDeterministicFakes --no-daemon
      - name: Verify CI test job contracts
        run: ./gradlew -p buildSrc test --tests org.hermesnative.client.buildlogic.QualityGateConfigurationTest --no-daemon
      - name: Verify fail-closed quality verification
        run: ./gradlew -p buildSrc test --tests org.hermesnative.client.buildlogic.QualityVerificationFailClosedTest --no-daemon
      - name: Verify the coverage, mutation, and boundary evidence rules
        run: >-
          ./gradlew -p buildSrc test
          --tests org.hermesnative.client.buildlogic.CoverageEvidenceTest
          --tests org.hermesnative.client.buildlogic.MutationEvidenceTest
          --tests org.hermesnative.client.buildlogic.BoundaryDoubleVerifierTest
          --tests org.hermesnative.client.buildlogic.ReportEvidenceTest
          --no-daemon

  coverage_mutation:
    name: coverage-mutation
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify coverage and mutation thresholds
        run: ./gradlew coverageVerify mutationVerify --no-daemon --console=plain

  # The squash merge writes the pull-request title onto main, so the title and every commit that
  # reaches the branch must be a valid Conventional Commit.
  commit_message:
    name: commit-message
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the squash and commit messages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-conventional-commits.py

  compose_test:
    name: compose-jvm-tests
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify Roborazzi baseline manifest
        run: ./gradlew :feature:entry:presentation:verifyRoborazziBaselineManifest --no-daemon --console=plain
      - name: Verify Roborazzi pixels
        run: ./gradlew :feature:entry:presentation:verifyRoborazziDebug --no-daemon --console=plain
      - name: Redact Compose test reports
        id: redact_compose_reports
        if: ${{ failure() }}
        timeout-minutes: 1
        run: python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" 'feature/entry/presentation/build/test-results/**/*.xml' 'feature/entry/presentation/build/reports/roborazzi/**/*.html'
      - name: Upload Compose test reports
        if: ${{ failure() && steps.redact_compose_reports.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          # Screenshot tests use the committed synthetic state matrix, never a live Gateway.
          path: |
            feature/entry/presentation/build/test-results/**/*.xml
            feature/entry/presentation/build/reports/roborazzi/**/*.html
            feature/entry/presentation/build/outputs/roborazzi-comparison/**/*.png
            feature/entry/presentation/build/intermediates/roborazzi/*.png
          if-no-files-found: warn
          retention-days: 14

  # Repository settings are part of the protected-main contract, so this run reads them back and
  # fails when the ruleset, the merge policy, or the fork policy drifts from the declared rules.
  conformance:
    name: conformance
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the repository configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-repository-conformance.py
      - name: Verify signing environment protections without secret access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py environment

  api24_instrumentation:
    name: api24-instrumentation
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android test evidence
        run: |
          rm -rf artifacts/android-test-evidence
          mkdir -p artifacts/android-test-evidence
          rm -f artifacts/android-test-evidence-redaction-pending
          printf '%s\n' 'Evidence sanitization is pending.' > artifacts/android-test-evidence-redaction-pending
          date +%s > artifacts/android-test-evidence/android-test-start-epoch.txt
          chmod +x .github/scripts/android-test-evidence.sh
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected Android tests
        id: android_tests
        continue-on-error: true
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_TIMEOUT_SECONDS: '480'
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            .github/scripts/android-test-evidence.sh

      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: printf '%s\n' 'Workflow cancellation detected.'
      - name: Finalize Android test evidence
        id: finalize_android_evidence
        if: ${{ always() }}
        env:
          ANDROID_TEST_OUTCOME: ${{ steps.android_tests.outcome }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome == 'success' || job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          evidence_dir=artifacts/android-test-evidence
          mkdir -p "$evidence_dir/instrumentation-output"

          category_file="$evidence_dir/failure-category.txt"
          start_epoch=0
          if [[ -s "$evidence_dir/android-test-start-epoch.txt" ]]; then
            read -r start_epoch < "$evidence_dir/android-test-start-epoch.txt"
          fi
          if ! [[ "$start_epoch" =~ ^[0-9]+$ ]]; then
            start_epoch=0
          fi
          elapsed_seconds=0
          if (( start_epoch > 0 )); then
            elapsed_seconds=$(( $(date +%s) - start_epoch ))
          fi
          if [[ "$WORKFLOW_CANCELLED" == "true" || "$ANDROID_TEST_OUTCOME" == "cancelled" ]]; then
            printf '%s\n' 'category=cancellation' > "$category_file"
          elif [[ ! -s "$category_file" ]] || grep -qx 'category=success' "$category_file"; then
            if [[ "$ANDROID_TEST_OUTCOME" == "failure" ]]; then
              if (( elapsed_seconds >= 600 )); then
                printf '%s\n' 'category=timeout' > "$category_file"
              else
                printf '%s\n' 'category=emulator_failure' > "$category_file"
              fi
            elif [[ "$ANDROID_TEST_OUTCOME" == "success" ]]; then
              printf '%s\n' 'category=success' > "$category_file"
            else
              printf '%s\n' 'category=test_failure' > "$category_file"
            fi
          fi

          if [[ ! -s "$evidence_dir/runner-output.log" ]]; then
            printf 'The emulator action stopped before the test wrapper started. Step outcome: %s.\n' "$ANDROID_TEST_OUTCOME" > "$evidence_dir/runner-output.log"
          fi
          if [[ ! -s "$evidence_dir/logcat.log" ]]; then
            printf 'No logcat was available when the evidence step finalized.\n' > "$evidence_dir/logcat.log"
          fi
          if [[ ! -e "$evidence_dir/instrumentation-output/NOT_AVAILABLE.txt" ]] && ! find "$evidence_dir/instrumentation-output" -type f -print -quit | grep -q .; then
            printf 'No instrumentation reports were available when the evidence step finalized.\n' > "$evidence_dir/instrumentation-output/NOT_AVAILABLE.txt"
          fi
          if [[ ! -s "$evidence_dir/timeout-context.txt" ]]; then
            {
              printf 'category=%s\n' "$(cut -d= -f2- "$category_file")"
              printf 'android_test_step_outcome=%s\n' "$ANDROID_TEST_OUTCOME"
              printf 'job_status_at_finalize=%s\n' "$JOB_STATUS"
              printf 'workflow_cancelled=%s\n' "$WORKFLOW_CANCELLED"
              printf 'github_run_id=%s\n' "${GITHUB_RUN_ID:-unknown}"
              printf 'github_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:-unknown}"
              printf 'github_sha=%s\n' "${GITHUB_SHA:-unknown}"
              printf 'github_workflow=%s\n' "${GITHUB_WORKFLOW:-unknown}"
              printf 'github_job=%s\n' "${GITHUB_JOB:-unknown}"
              printf 'github_ref_name=%s\n' "${GITHUB_REF_NAME:-unknown}"
              printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            } > "$evidence_dir/timeout-context.txt"
          fi
          pending_marker=artifacts/android-test-evidence-redaction-pending
          wrapper_started="$evidence_dir/wrapper-started.txt"
          if [[ ! -e "$wrapper_started" ]]; then
            rm -f -- "$pending_marker" || true
          fi
          if [[ -e "$pending_marker" ]]; then
            printf '%s\n' 'Evidence sanitization did not complete; skipping artifact upload.' >&2
            printf '%s\n' 'redaction_ready=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf '%s\n' 'redaction_ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload Android test failure evidence
        id: upload_android_evidence
        if: ${{ always() && steps.android_tests.outcome != 'success' && steps.finalize_android_evidence.outputs.redaction_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/android-test-evidence
          if-no-files-found: error
          # Sanitized Android failure evidence is retained for 14 days.
          retention-days: 14
      - name: Report API 24 instrumentation result
        if: ${{ always() }}
        env:
          ANDROID_TEST_OUTCOME: ${{ steps.android_tests.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize_android_evidence.outcome }}
          ARTIFACT_URL: ${{ steps.upload_android_evidence.outputs.artifact-url }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome == 'success' || job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          category=unknown
          category_file=artifacts/android-test-evidence/failure-category.txt
          if [[ -s "$category_file" ]]; then
            IFS='=' read -r category_key category_value < "$category_file"
            if [[ "$category_key" == category && -n "$category_value" ]]; then
              category="$category_value"
            fi
          fi

          if [[ "$WORKFLOW_CANCELLED" == "true" || "$ANDROID_TEST_OUTCOME" == "cancelled" || "$category" == "cancellation" ]]; then
            result=cancellation
          elif [[ "$category" == "timeout" ]]; then
            result=timeout
          elif [[ "$ANDROID_TEST_OUTCOME" == "success" && "$FINALIZE_OUTCOME" == "success" && "$category" == "success" ]]; then
            result=pass
          else
            result=failure
          fi

          if [[ -n "$ARTIFACT_URL" ]]; then
            artifact_summary="- Diagnostic artifacts: [Open run artifacts]($ARTIFACT_URL)"
          else
            artifact_summary='- Diagnostic artifacts: Not uploaded.'
          fi
          {
            printf '## API 24 instrumentation: %s\n\n' "$result"
            # The backticks are Markdown formatting, not shell substitutions.
            # shellcheck disable=SC2016
            printf -- '- Result: `%s`\n' "$result"
            # shellcheck disable=SC2016
            printf -- '- Failure category: `%s`\n' "$category"
            printf '%s\n' "$artifact_summary"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when Android tests fail
        if: ${{ always() && (steps.android_tests.outcome != 'success' || steps.finalize_android_evidence.outcome != 'success') }}
        run: |
          printf '%s\n' 'Android instrumentation failed. See the sanitized failure evidence artifact.' >&2
          exit 1

  maestro_journeys:
    name: maestro-journeys
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MAESTRO_CLI_VERSION: '2.10.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the exact candidate APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Record candidate APK evidence
        run: |
          mkdir -p artifacts/journey-evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk > artifacts/journey-evidence/apk-sha256.txt
          cat artifacts/journey-evidence/apk-sha256.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache pinned Maestro CLI archive
        uses: actions/cache@v4
        with:
          path: maestro.zip
          key: maestro-cli-${{ env.MAESTRO_CLI_VERSION }}
      - name: Run deterministic Maestro journeys
        id: journeys
        continue-on-error: true
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -writable-system
          disable-animations: true
          script: |
            chmod +x .github/scripts/journey-run.sh
            .github/scripts/journey-run.sh
      - name: Redact journey failure evidence
        id: redact_journey_evidence
        if: ${{ always() && steps.journeys.outcome != 'success' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" \
            'artifacts/journey-evidence/*.log' 'artifacts/journey-evidence/**/*.log' \
            'artifacts/journey-evidence/*.json' 'artifacts/journey-evidence/**/*.json' \
            'artifacts/journey-evidence/*.txt' 'artifacts/journey-evidence/**/*.txt'
      - name: Upload journey failure evidence
        if: ${{ always() && steps.journeys.outcome != 'success' && steps.redact_journey_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/journey-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when journeys fail
        if: ${{ steps.journeys.outcome != 'success' }}
        run: |
          printf '%s\n' 'Deterministic emulator journeys failed. See the journey evidence artifact.' >&2
          exit 1

  create_nightly_failure_issue:
    name: create-nightly-failure-issue
    if: ${{ always() && github.event_name == 'schedule' && (needs.unit_tests.result != 'success' || needs.compose_test.result != 'success' || needs.api24_instrumentation.result != 'success' || needs.maestro_journeys.result != 'success') }}
    needs: [unit_tests, compose_test, api24_instrumentation, maestro_journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nightly-failure-issue-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JOB_RESULTS: >-
            {"unit_tests":"${{ needs.unit_tests.result }}","compose_test":"${{ needs.compose_test.result }}","api24_instrumentation":"${{ needs.api24_instrumentation.result }}","maestro_journeys":"${{ needs.maestro_journeys.result }}"}
        run: .github/scripts/create-nightly-failure-issue.sh

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - fork_guard
      - draft_validation
      - formatting
      - static_analysis
      - unit_tests
      - fixture_descriptor
      - fixture_lifecycle
      - fixture_contract
      - android_build
      - architecture_check
      - coverage_mutation
      - commit_message
      - compose_test
      - conformance
      - api24_instrumentation
      - maestro_journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify declared checks and results
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          FIXTURE_DESCRIPTOR_RESULT: ${{ needs.fixture_descriptor.result }}
          FIXTURE_LIFECYCLE_RESULT: ${{ needs.fixture_lifecycle.result }}
          FIXTURE_CONTRACT_RESULT: ${{ needs.fixture_contract.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          ARCHITECTURE_CHECK_RESULT: ${{ needs.architecture_check.result }}
          COVERAGE_MUTATION_RESULT: ${{ needs.coverage_mutation.result }}
          COMPOSE_TEST_RESULT: ${{ needs.compose_test.result }}
          API24_INSTRUMENTATION_RESULT: ${{ needs.api24_instrumentation.result }}
          MAESTRO_JOURNEYS_RESULT: ${{ needs.maestro_journeys.result }}
          FORK_GUARD_RESULT: ${{ needs.fork_guard.result }}
          DRAFT_VALIDATION_RESULT: ${{ needs.draft_validation.result }}
          COMMIT_MESSAGE_RESULT: ${{ needs.commit_message.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_FORK: ${{ github.event.pull_request.head.repo.fork }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="$(awk 'NF' .github/quality-gate/required-checks.txt)"
          expected_declaration='formatting
          static_analysis
          unit_tests
          fixture_descriptor
          fixture_lifecycle
          fixture_contract
          android_build
          architecture_check
          coverage_mutation
          compose_test
          conformance
          commit_message
          draft_validation
          fork_guard
          api24_instrumentation
          maestro_journeys'
          if [ "$expected" != "$expected_declaration" ]; then
            printf '%s\n' 'Required check declaration does not match the aggregate gate.' >&2
            exit 1
          fi
          require() {
            if [ "$2" != success ]; then
              printf 'Required quality check %s result: %s\n' "$1" "$2" >&2
              exit 1
            fi
          }
          expect() {
            if [ "$2" != "$3" ]; then
              printf 'Check %s must report %s for this run, but reported %s.\n' "$1" "$3" "$2" >&2
              exit 1
            fi
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            # A pull request reaches the protected branch only when it targets it.
            if [ "$EVENT_BASE_REF" != main ]; then
              printf 'The protected-main workflow accepts pull requests that target main, but this one targets %s.\n' "$EVENT_BASE_REF" >&2
              exit 1
            fi
            require fork_guard "$FORK_GUARD_RESULT"
            if [ "$EVENT_FORK" = true ]; then
              # An external fork never runs the complete gate, and its required status must never be
              # green: the only merge path is an in-repository branch a maintainer validates.
              expect draft_validation "$DRAFT_VALIDATION_RESULT" skipped
              expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
              printf '%s\n' 'External-fork pull request: the complete gate did not run, so this head has no passing required status. Carry the change onto an in-repository branch, where the complete gate validates it before a maintainer merges it.' >&2
              exit 1
            elif [ "$EVENT_DRAFT" = true ]; then
              # A draft runs the lightweight validation only; the complete gate is skipped until the
              # pull request is ready for review.
              require draft_validation "$DRAFT_VALIDATION_RESULT"
              expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
              expected_state=skipped
            else
              require draft_validation "$DRAFT_VALIDATION_RESULT"
              require commit_message "$COMMIT_MESSAGE_RESULT"
              expected_state=success
            fi
            for result in \
              "$FORMATTING_RESULT" \
              "$STATIC_ANALYSIS_RESULT" \
              "$UNIT_TESTS_RESULT" \
              "$FIXTURE_DESCRIPTOR_RESULT" \
              "$FIXTURE_LIFECYCLE_RESULT" \
              "$FIXTURE_CONTRACT_RESULT" \
              "$ANDROID_BUILD_RESULT" \
              "$ARCHITECTURE_CHECK_RESULT" \
              "$COVERAGE_MUTATION_RESULT" \
              "$COMPOSE_TEST_RESULT" \
              "$CONFORMANCE_RESULT"; do
              if [ "$result" != "$expected_state" ]; then
                printf 'Required quality check result: %s\n' "$result" >&2
                exit 1
              fi
            done
            test "$API24_INSTRUMENTATION_RESULT" = skipped
            test "$MAESTRO_JOURNEYS_RESULT" = skipped
          else
            for result in \
              "$FORMATTING_RESULT" \
              "$STATIC_ANALYSIS_RESULT" \
              "$UNIT_TESTS_RESULT" \
              "$FIXTURE_DESCRIPTOR_RESULT" \
              "$FIXTURE_LIFECYCLE_RESULT" \
              "$FIXTURE_CONTRACT_RESULT" \
              "$ANDROID_BUILD_RESULT" \
              "$ARCHITECTURE_CHECK_RESULT" \
              "$COVERAGE_MUTATION_RESULT" \
              "$COMPOSE_TEST_RESULT" \
              "$CONFORMANCE_RESULT"; do
              if [ "$result" != success ]; then
                printf 'Required quality check result: %s\n' "$result" >&2
                exit 1
              fi
            done
            expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
            expect fork_guard "$FORK_GUARD_RESULT" skipped
            expect draft_validation "$DRAFT_VALIDATION_RESULT" skipped
            test "$API24_INSTRUMENTATION_RESULT" = success
            test "$MAESTRO_JOURNEYS_RESULT" = success
          fi
          printf '%s\n' 'All checks required for this event passed.'
