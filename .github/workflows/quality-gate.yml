name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew formatCheck --no-daemon

  static_analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDebug --no-daemon

  unit_tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRequiredUnitTests --no-daemon

  android_build:
    name: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

  architecture_check:
    name: architecture-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew architectureCheck verifyNoMocks --no-daemon

  compose_test:
    name: compose-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :feature:entry:presentation:verifyConnectedAndroidTests :app:verifyConnectedAndroidTests --no-daemon

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - formatting
      - static_analysis
      - unit_tests
      - android_build
      - architecture_check
      - compose_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify declared checks and results
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          ARCHITECTURE_CHECK_RESULT: ${{ needs.architecture_check.result }}
          COMPOSE_TEST_RESULT: ${{ needs.compose_test.result }}
        run: |
          set -euo pipefail
          expected='formatting
          static_analysis
          unit_tests
          android_build
          architecture_check
          compose_test'
          actual="$(tr -d '\r' < .github/quality-gate/required-checks.txt)"
          if [ "$actual" != "$expected" ]; then
            printf '%s\n' 'Required check declaration does not match the aggregate gate.' >&2
            exit 1
          fi
          for result in \
            "$FORMATTING_RESULT" \
            "$STATIC_ANALYSIS_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$ANDROID_BUILD_RESULT" \
            "$ARCHITECTURE_CHECK_RESULT" \
            "$COMPOSE_TEST_RESULT"; do
            if [ "$result" != success ]; then
              printf 'Required quality check result: %s\n' "$result" >&2
              exit 1
            fi
          done
          printf '%s\n' 'All declared quality checks executed and passed.'
