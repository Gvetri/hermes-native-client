name: protected-release-signing

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful quality-gate run for the exact main source
        required: true
        type: string
  workflow_call:
    inputs:
      validation_run_id:
        required: true
        type: string
      nightly_version_code:
        description: Generated by the Nightly caller, never a manual version choice
        required: false
        default: ''
        type: string
      generation_attempt:
        required: false
        default: ''
        type: string
    outputs:
      source_sha:
        description: Exact validated source commit
        value: ${{ jobs.prepare.outputs.source_sha }}
      signed_artifact_id:
        description: Verified signed APK artifact from this run
        value: ${{ jobs.sign.outputs.artifact_id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: protected-release-signing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'Gvetri/hermes-native-client' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      validation_run_id: ${{ steps.source.outputs.validation_run_id }}
      validation_run_attempt: ${{ steps.source.outputs.validation_run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the protected signing environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py environment
      - name: Verify exact-source deterministic validation
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: python3 .github/scripts/release-signing.py source

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      unsigned_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build the validated source without signing access
        env:
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_VERSION_CODE: ${{ inputs.nightly_version_code }}
          RELEASE_GENERATION_ATTEMPT: ${{ inputs.generation_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          if [ -n "$RELEASE_VERSION_CODE" ]; then
            python3 .github/scripts/release-signing.py generation
            ./gradlew :app:assembleRelease --no-daemon \
              -PnightlyVersionCode="$RELEASE_VERSION_CODE" -PnightlySourceSha="$RELEASE_SOURCE_SHA"
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi
      - name: Bind the unsigned APK checksum to this build
        id: digest
        run: |
          set -euo pipefail
          checksum=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk)
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.validation_run_id }}
      RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.prepare.outputs.validation_run_attempt }}
      RELEASE_UNSIGNED_SHA256: ${{ needs.build.outputs.unsigned_sha256 }}
      RELEASE_VERSION_CODE: ${{ inputs.nightly_version_code }}
      RELEASE_GENERATION_ATTEMPT: ${{ inputs.generation_attempt }}
    steps:
      # The signing tools come from the protected workflow revision, not the APK or its source tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: unsigned
          merge-multiple: true
      - name: Recheck the exact validation attempt after the approval wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py source
      - name: Verify this run's explicit human approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py approval
      - name: Reject a retained Nightly version from an earlier attempt
        if: ${{ inputs.nightly_version_code != '' }}
        run: python3 .github/scripts/release-signing.py generation
      - name: Sign and verify the pinned release identity
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/sign-release-apk.py unsigned/app-release-unsigned.apk signed .github/release-certificate.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signed/hermes-native-client.apk
            signed/SHA256SUMS
            signed/signing-metadata.json
          if-no-files-found: error
          retention-days: 14
