appId: org.hermesnative.client
name: explicit-retry
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Retry Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Message"
- inputText: "Retry this"
- hideKeyboard
- tapOn: "Send"
# The pinned Gateway's history carries no Run linkage, so the client retries
# only the failed Run it created itself: the Session summary exposes the
# explicit retry once the Run settles as failed and the authoritative history
# has replaced the temporary observed response. The retry reuses the original
# input still held in process memory and must submit exactly one new Run.
- extendedWaitUntil:
    visible: "Run state: Failed"
    timeout: 30000
- scrollUntilVisible:
    element: "Stable retry failure"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Latest Run: run-retry-1"
    timeout: 30000
- extendedWaitUntil:
    visible: "Stable retry failure"
    timeout: 30000
- extendedWaitUntil:
    visible: "Try again"
    timeout: 30000
- tapOn:
    text: "Try again"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Run state: Succeeded"
    timeout: 30000
- scrollUntilVisible:
    element: "Stable retry success"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Stable retry success"
    timeout: 30000
- assertVisible: "Stable retry success"
- assertNotVisible: "Try again"
