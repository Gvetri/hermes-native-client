appId: org.hermesnative.client
name: explicit-retry
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Retry Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Write a message"
- inputText: "Retry this"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "This Run failed. Your conversation is preserved."
    timeout: 30000
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "Succeeded"
    timeout: 30000
- assertVisible: "Stable retry success"
