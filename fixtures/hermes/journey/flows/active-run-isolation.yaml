appId: org.hermesnative.client
name: active-run-isolation
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Write a message"
- inputText: "Run this"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Active partial"
    timeout: 30000
- tapOn: "Refresh history"
- extendedWaitUntil:
    visible: "Active partial"
    timeout: 30000
- tapOn: "Back to Sessions"
- tapOn: "Beta Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible: "Message"
- tapOn: "Back to Sessions"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Active partial"
    timeout: 30000
