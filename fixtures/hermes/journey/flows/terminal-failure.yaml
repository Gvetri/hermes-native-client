appId: org.hermesnative.client
name: terminal-failure
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Message"
- inputText: "Fail this"
- hideKeyboard
- tapOn: "Send"
# The pinned Gateway settles the failed Run through the Run resource; its
# history carries no Run linkage, so the settled summary shows the tracked
# Run and the authoritative history replaces the temporary observed response.
- extendedWaitUntil:
    visible: "Run state: Failed"
    timeout: 30000
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- extendedWaitUntil:
    visible: "Latest Run: run-failure"
    timeout: 30000
- assertVisible: "Stable failure result"
