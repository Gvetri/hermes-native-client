appId: org.hermesnative.client
name: interrupted-sse-refetch
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Message"
- inputText: "Interrupt this"
- hideKeyboard
- tapOn: "Send"
# The interrupted stream is refetched through the Run resource; the pinned
# history carries no Run linkage, so the settled summary shows the tracked
# Run and the authoritative history replaces the interrupted partial response.
- extendedWaitUntil:
    visible: "Run state: Failed"
    timeout: 30000
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- extendedWaitUntil:
    visible: "Latest Run: interrupted-run"
    timeout: 30000
- assertVisible: "Refetched failure"
