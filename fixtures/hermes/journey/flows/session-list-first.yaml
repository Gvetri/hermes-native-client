appId: org.hermesnative.client
name: session-list-first
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- assertVisible: "Sessions"
- assertVisible: "Alpha Session"
- assertVisible: "Beta Session"
- assertVisible: "Pinned"
- assertVisible: "Search Sessions"
- assertVisible: "Create Session"
