appId: org.hermesnative.client
name: markdown-links
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Markdown Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
# Emphasis renders natively: the markers are never part of the shown text, and
# each message card carries its own explicit actions.
- assertVisible: "Safe Markdown text"
- assertVisible: "Copy message"
- assertVisible: "Share message"
# An HTTPS link renders as its label, and its literal target is never displayed.
# The transcript scrolls, so every later message is reached by scrolling to it.
- scrollUntilVisible:
    element:
      text: ".*the secure page.*"
    direction: DOWN
- assertVisible: ".*Visit the safe HTTPS link.*"
- assertNotVisible: ".*example.com/secure.*"
# A rejected scheme stays inert text exactly as authored.
- scrollUntilVisible:
    element:
      text: ".*stays plain text.*"
    direction: DOWN
- assertVisible: ".*javascript:alert.*"
# A fenced code block renders literally in its own scrollable region.
- scrollUntilVisible:
    element:
      text: ".*val total = 1.*"
    direction: DOWN
- assertVisible: "Copy code"
- assertVisible: "Message"
